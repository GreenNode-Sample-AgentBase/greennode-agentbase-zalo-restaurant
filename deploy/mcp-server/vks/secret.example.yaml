# EXAMPLE ONLY. Do not commit a real secret.
# Preferred: create the secret from the command line so the value never lands in a file:
#
#   kubectl -n restaurant-mcp create secret generic restaurant-mcp-secret \
#     --from-literal=MCP_API_KEYS="$(openssl rand -hex 32)"
#
# Record the value: the SAME value goes into Access Control (API Key provider of the
# `restaurant` connector). If you do use this file, copy it to secret.yaml (git-ignored),
# replace the placeholder and apply it.
apiVersion: v1
kind: Secret
metadata:
  name: restaurant-mcp-secret
  namespace: restaurant-mcp
type: Opaque
stringData:
  # Several keys separated by commas allow rotation.
  MCP_API_KEYS: "<openssl rand -hex 32>"
