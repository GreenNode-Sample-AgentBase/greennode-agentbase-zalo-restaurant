# EXAMPLE ONLY. Do not commit real values. Prefer creating the Secret from the command line
# (see README step 3) so secrets never touch a file:
#
#   kubectl -n langfuse create secret generic langfuse-secrets \
#     --from-literal=nextauth-secret="$(openssl rand -hex 32)" \
#     --from-literal=salt="$(openssl rand -hex 32)" \
#     --from-literal=encryption-key="$(openssl rand -hex 32)" \
#     --from-literal=postgres-password="$(openssl rand -hex 24)" \
#     --from-literal=postgres-admin-password="$(openssl rand -hex 24)" \
#     --from-literal=clickhouse-password="$(openssl rand -hex 24)" \
#     --from-literal=redis-password="$(openssl rand -hex 24)" \
#     --from-literal=s3-root-user=minio \
#     --from-literal=s3-root-password="$(openssl rand -hex 24)"
#
# Key names must match values.yaml. Keep a copy of the generated values in a password manager:
# losing `encryption-key` or `salt` makes stored credentials and API keys unusable.
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-secrets
  namespace: langfuse
type: Opaque
stringData:
  nextauth-secret: "<openssl rand -hex 32>"
  salt: "<openssl rand -hex 32>"
  encryption-key: "<openssl rand -hex 32>"        # must be 64 hex characters
  postgres-password: "<openssl rand -hex 24>"
  postgres-admin-password: "<openssl rand -hex 24>"
  clickhouse-password: "<openssl rand -hex 24>"
  redis-password: "<openssl rand -hex 24>"
  s3-root-user: "minio"
  s3-root-password: "<openssl rand -hex 24>"
