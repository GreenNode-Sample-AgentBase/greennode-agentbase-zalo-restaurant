name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r src/backend/requirements.txt
          pip install -r src/mcp-server/requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Syntax check frontend
        run: node --check src/frontend/app.js
      - name: Syntax check deploy scripts
        run: bash -n deploy/check_connectivity.sh
