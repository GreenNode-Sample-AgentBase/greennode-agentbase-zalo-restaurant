# INTERNAL load balancer in front of Langfuse web (port 3000), reachable only inside the
# customer VPC: by the agent runtime (private connection) and by admins over the VPN.
# Apply AFTER `helm install` (the selector matches the chart's web pods, release name `langfuse`).
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web-internal
  namespace: langfuse
  labels:
    app.kubernetes.io/name: langfuse
  # TODO (REQUIRED before apply): add the annotation that makes the GreenNode load balancer
  # INTERNAL and selects its subnet, per the GreenNode vLB / VKS documentation. Do not guess the
  # annotation name. Without it the LB may be created with a public address, which would expose
  # Langfuse to the Internet. Do not apply this file until the annotation is in place.
  # annotations:
  #   <annotation-internal-lb>: "<value>"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/instance: langfuse
    app: web
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
