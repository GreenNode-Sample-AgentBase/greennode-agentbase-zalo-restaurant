# Local development only: the agent and the MCP server on your machine.
# Production runs them in different places (agent on AgentBase, MCP server in the customer VPC):
# see deploy/ and the README.
#
#   cp .env.example .env     # LLM_*, memory ids, GREENNODE_CLIENT_ID / GREENNODE_CLIENT_SECRET
#   docker compose up --build
#   open http://localhost:8080
name: zalo-restaurant-local

services:
  mcp-server:
    build:
      context: ./src/mcp-server
    environment:
      # Local use only. In production the server requires MCP_API_KEYS (fail-closed).
      ALLOW_ANONYMOUS: "true"
      PORT: "8080"
      MCP_DB_PATH: /app/data/restaurant.db
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - mcp_data:/app/data

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      MCP_RESTAURANT_URL: http://mcp-server:8080/mcp
      SERVE_UI: "true"
    depends_on:
      - mcp-server
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mcp_data:
